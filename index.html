<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战 - Tank Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      width: 780px;
      color: #e0e0e0;
      font-size: 16px;
      padding: 0 10px;
    }

    .game-header span {
      background: #16213e;
      padding: 8px 16px;
      border-radius: 4px;
      border: 2px solid #0f3460;
    }

    .game-header .lives { color: #e94560; }
    .game-header .level { color: #f5c518; }
    .game-header .score { color: #4ecca3; }

    canvas {
      border: 3px solid #0f3460;
      background: #0a0a0a;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(15, 52, 96, 0.5);
    }

    .controls-hint {
      color: #555;
      font-size: 13px;
      text-align: center;
    }

    .controls-hint kbd {
      background: #16213e;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid #0f3460;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-header">
      <span class="lives">❤️ x <strong id="livesDisplay">3</strong></span>
      <span class="level">Stage <strong id="levelDisplay">1</strong></span>
      <span class="score">Score: <strong id="scoreDisplay">0</strong></span>
    </div>
    <canvas id="gameCanvas" width="780" height="600"></canvas>
    <div class="controls-hint">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Move &nbsp;|&nbsp;
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Aim &nbsp;|&nbsp;
      <kbd>Space</kbd> Shoot &nbsp;|&nbsp;
      <kbd>P</kbd> Pause
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      const TILE = 30;
      const ROWS = H / TILE;
      const COLS = W / TILE;

      // --- DOM Elements ---
      const livesDisplay = document.getElementById('livesDisplay');
      const levelDisplay = document.getElementById('levelDisplay');
      const scoreDisplay = document.getElementById('scoreDisplay');

      // --- Audio ---
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      function beep(freq, duration, type = 'square', vol = 0.08) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }
      function sfxShoot() { beep(200, 0.1, 'square', 0.06); beep(100, 0.08, 'sawtooth', 0.04); }
      function sfxHit() { beep(80, 0.15, 'square', 0.1); beep(60, 0.2, 'triangle', 0.08); }
      function sfxExplosion() { beep(40, 0.4, 'sawtooth', 0.15); }
      function sfxPowerUp() { beep(600, 0.1, 'square', 0.06); beep(900, 0.1, 'square', 0.06); }

      // --- Game State ---
      let gameState = 'menu'; // menu | playing | paused | levelClear | gameOver
      let score = 0;
      let lives = 3;
      let level = 1;
      let player = null;
      let enemies = [];
      let bullets = [];
      let walls = [];
      let particles = [];
      let powerUps = [];
      let spawnTimer = 0;
      let spawnDelay = 180;
      let enemiesPerLevel = 4;
      let enemiesSpawned = 0;
      let totalEnemies = 0;
      let frameCount = 0;
      let shakeTimer = 0;
      let shakeIntensity = 0;

      // --- Input ---
      const keys = {};
      window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyP') {
          if (gameState === 'playing') { gameState = 'paused'; }
          else if (gameState === 'paused') { gameState = 'playing'; }
        }
        if (e.code === 'Space' || e.code.startsWith('Arrow')) {
          e.preventDefault();
        }
        initAudio();
        if (gameState === 'menu') { startGame(); }
        if (gameState === 'gameOver' && e.code === 'Space') { resetGame(); startGame(); }
        if (gameState === 'levelClear' && e.code === 'Space') { nextLevel(); }

        // Shoot on Space press (event-driven, bypasses frame timing)
        if (e.code === 'Space' && gameState === 'playing' && player && player.active) {
          player.shoot();
        }
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });

      // --- Classes ---
      class Tank {
        constructor(x, y, dir, color, isPlayer = false) {
          this.x = x;
          this.y = y;
          this.dir = dir; // movement direction: 0=up, 1=right, 2=down, 3=left
          this.facingDir = dir; // barrel/turret facing direction
          this.color = color;
          this.isPlayer = isPlayer;
          this.speed = isPlayer ? 2.5 : 1.2;
          this.size = TILE - 10;
          this.half = this.size / 2;
          this.shootCooldown = 0;
          this.shootDelay = isPlayer ? 20 : 60;
          this.active = true;
          this.hp = isPlayer ? 1 : 1;
          this.aiTimer = 0;
          this.aiAction = 'move';
          this.aiDir = dir;
          this.flash = 0;
        }

        getBounds() {
          return {
            left: this.x - this.half,
            right: this.x + this.half,
            top: this.y - this.half,
            bottom: this.y + this.half,
          };
        }

        collidesWith(other) {
          const a = this.getBounds();
          const b = other.getBounds();
          return !(a.right <= b.left || a.left >= b.right ||
            a.bottom <= b.top || a.top >= b.bottom);
        }

        collidesWithWall() {
          const b = this.getBounds();
          for (let w of walls) {
            if (w.active) {
              const wb = w.getBounds();
              if (!(b.right <= wb.left + 1 || b.left >= wb.right - 1 ||
                b.bottom <= wb.top + 1 || b.top >= wb.bottom - 1)) {
                return w;
              }
            }
          }
          return null;
        }

        collidesWithAnyTank() {
          if (this.isPlayer) {
            for (let e of enemies) {
              if (e.active && this.collidesWith(e)) return e;
            }
          } else {
            if (player && player.active && this.collidesWith(player)) return player;
            for (let e of enemies) {
              if (e !== this && e.active && this.collidesWith(e)) return e;
            }
          }
          return null;
        }

        move(dir) {
          const dx = [0, this.speed, 0, -this.speed][dir];
          const dy = [-this.speed, 0, this.speed, 0][dir];

          // Move and resolve per-axis for smooth wall sliding
          this.x += dx;
          this.x = Math.max(this.half, Math.min(W - this.half, this.x));
          if (this.collidesWithWall() || this.collidesWithAnyTank()) {
            this.x -= dx;
          }

          this.y += dy;
          this.y = Math.max(this.half, Math.min(H - this.half, this.y));
          if (this.collidesWithWall() || this.collidesWithAnyTank()) {
            this.y -= dy;
          }
        }

        update() {
          if (!this.active) return;
          if (this.shootCooldown > 0) this.shootCooldown--;
          if (this.flash > 0) this.flash--;

          if (this.isPlayer) {
            // Movement: arrow keys
            if (keys['ArrowUp'])      { this.dir = 0; this.move(0); }
            else if (keys['ArrowDown'])  { this.dir = 2; this.move(2); }
            else if (keys['ArrowLeft'])  { this.dir = 3; this.move(3); }
            else if (keys['ArrowRight']) { this.dir = 1; this.move(1); }

            // Facing: WASD overrides, otherwise face movement direction
            if (keys['KeyW'])           this.facingDir = 0;
            else if (keys['KeyS'])      this.facingDir = 2;
            else if (keys['KeyA'])      this.facingDir = 3;
            else if (keys['KeyD'])      this.facingDir = 1;
            else                        this.facingDir = this.dir;
          } else {
            this.aiUpdate();
          }
        }

        aiUpdate() {
          // Simple but effective AI
          if (frameCount % 3 !== 0) return;

          // Check if player is in line of sight
          const canSeePlayer = this.canSee(player);

          if (canSeePlayer) {
            // Face and shoot player
            this.dir = canSeePlayer;
            this.facingDir = this.dir;
            this.shoot();
            // Chase occasionally
            if (Math.random() < 0.3) this.move(this.dir);
          } else {
            this.aiTimer--;
            if (this.aiTimer <= 0) {
              this.aiTimer = 30 + Math.floor(Math.random() * 60);
              if (Math.random() < 0.3) {
                // random turn
                this.dir = Math.floor(Math.random() * 4);
                this.facingDir = this.dir;
              }
              if (Math.random() < 0.5) {
                this.aiAction = 'move';
              } else {
                this.aiAction = 'shootAndMove';
              }
            }
            if (this.aiAction === 'move' || this.aiAction === 'shootAndMove') {
              this.move(this.dir);
              if (Math.random() < 0.15) this.shoot();
            }
          }
        }

        canSee(target) {
          if (!target || !target.active) return null;
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const threshold = TILE / 2;

          // Check horizontal
          if (Math.abs(dy) < threshold) {
            const dir = dx > 0 ? 1 : 3;
            // Check walls between
            let blocked = false;
            const step = dx > 0 ? TILE : -TILE;
            for (let cx = this.x + step; dx > 0 ? cx < target.x : cx > target.x; cx += step) {
              for (let w of walls) {
                if (w.active && !w.breakable) {
                  const wb = w.getBounds();
                  if (cx > wb.left && cx < wb.right && this.y > wb.top && this.y < wb.bottom) {
                    blocked = true;
                    break;
                  }
                }
              }
              if (blocked) break;
            }
            if (!blocked) return dir;
          }

          // Check vertical
          if (Math.abs(dx) < threshold) {
            const dir = dy > 0 ? 2 : 0;
            let blocked = false;
            const step = dy > 0 ? TILE : -TILE;
            for (let cy = this.y + step; dy > 0 ? cy < target.y : cy > target.y; cy += step) {
              for (let w of walls) {
                if (w.active && !w.breakable) {
                  const wb = w.getBounds();
                  if (cy > wb.top && cy < wb.bottom && this.x > wb.left && this.x < wb.right) {
                    blocked = true;
                    break;
                  }
                }
              }
              if (blocked) break;
            }
            if (!blocked) return dir;
          }
          return null;
        }

        shoot() {
          if (this.shootCooldown > 0) return;
          this.shootCooldown = this.shootDelay;
          const dir = this.facingDir;
          const bx = [0, this.half + 4, 0, -this.half - 4][dir];
          const by = [-this.half - 4, 0, this.half + 4, 0][dir];
          bullets.push(new Bullet(this.x + bx, this.y + by, dir, this.isPlayer));
          if (this.isPlayer) sfxShoot();
        }

        draw() {
          if (!this.active) return;
          ctx.save();
          ctx.translate(this.x, this.y);
          const angle = [0, Math.PI / 2, Math.PI, -Math.PI / 2][this.facingDir];
          ctx.rotate(angle);

          const flashOn = this.flash > 0 && this.flash % 4 < 2;

          // Tracks
          ctx.fillStyle = '#222';
          ctx.fillRect(-this.half, -this.half, 6, this.size);
          ctx.fillRect(this.half - 6, -this.half, 6, this.size);

          // Body
          ctx.fillStyle = flashOn ? '#fff' : this.color;
          ctx.fillRect(-this.half + 5, -this.half + 3, this.size - 10, this.size - 6);

          // Darker center
          ctx.fillStyle = flashOn ? '#fff' : this.shadeColor(this.color, -30);
          ctx.fillRect(-this.half + 8, -this.half + 6, this.size - 16, this.size - 12);

          // Turret
          ctx.fillStyle = flashOn ? '#fff' : this.shadeColor(this.color, 20);
          ctx.fillRect(-4, -this.half - 3, 8, 14);

          // Barrel
          ctx.fillStyle = '#444';
          ctx.fillRect(-2, -this.half - 10, 4, 12);

          ctx.restore();

          // Shield effect for player
          if (this.isPlayer) {
            ctx.strokeStyle = 'rgba(78, 204, 163, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.half + 3, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        shadeColor(color, percent) {
          const num = parseInt(color.replace('#', ''), 16);
          const amt = Math.round(2.55 * percent);
          const R = Math.max(0, Math.min(255, (num >> 16) + amt));
          const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
          const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
          return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        takeDamage() {
          this.flash = 12;
          this.hp--;
          if (this.hp <= 0) {
            this.active = false;
            spawnExplosion(this.x, this.y);
            sfxExplosion();
            if (this.isPlayer) {
              lives--;
              updateHUD();
              if (lives <= 0) {
                gameState = 'gameOver';
              } else {
                // Respawn
                spawnPlayer();
              }
            } else {
              score += 100;
              updateHUD();
              totalEnemies--;
              checkLevelClear();
            }
          }
        }
      }

      class Bullet {
        constructor(x, y, dir, fromPlayer) {
          this.x = x;
          this.y = y;
          this.dir = dir;
          this.fromPlayer = fromPlayer;
          this.speed = 5;
          this.size = 3;
          this.active = true;
        }

        update() {
          const dx = [0, this.speed, 0, -this.speed][this.dir];
          const dy = [-this.speed, 0, this.speed, 0][this.dir];
          this.x += dx;
          this.y += dy;

          // Out of bounds
          if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
            this.active = false;
            return;
          }

          // Wall collision
          for (let w of walls) {
            if (w.active && this.x > w.getBounds().left && this.x < w.getBounds().right &&
              this.y > w.getBounds().top && this.y < w.getBounds().bottom) {
              this.active = false;
              if (w.breakable) {
                w.active = false;
                spawnParticles(w.x, w.y, '#c49a2c');
                sfxHit();
              } else {
                spawnParticles(this.x, this.y, '#888');
              }
              return;
            }
          }

          // Tank collision
          if (this.fromPlayer) {
            for (let e of enemies) {
              if (e.active && this.x > e.getBounds().left && this.x < e.getBounds().right &&
                this.y > e.getBounds().top && this.y < e.getBounds().bottom) {
                this.active = false;
                e.takeDamage();
                return;
              }
            }
          } else {
            if (player && player.active &&
              this.x > player.getBounds().left && this.x < player.getBounds().right &&
              this.y > player.getBounds().top && this.y < player.getBounds().bottom) {
              this.active = false;
              player.takeDamage();
              return;
            }
          }
        }

        draw() {
          if (!this.active) return;
          ctx.fillStyle = this.fromPlayer ? '#4ecca3' : '#e94560';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          // Glow
          ctx.fillStyle = this.fromPlayer ? 'rgba(78,204,163,0.5)' : 'rgba(233,69,96,0.5)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      class PowerUp {
        constructor(x, y, type) {
          this.x = x;
          this.y = y;
          this.type = type; // 'speed' | 'rapid' | 'shield' | 'life'
          this.active = true;
          this.timer = 600;
        }

        update() {
          this.timer--;
          if (this.timer <= 0) this.active = false;
          if (player && player.active && player.collidesWith({
            getBounds: () => ({
              left: this.x - 14, right: this.x + 14,
              top: this.y - 14, bottom: this.y + 14
            })
          })) {
            this.apply();
            this.active = false;
          }
        }

        apply() {
          sfxPowerUp();
          if (this.type === 'life') {
            lives = Math.min(lives + 1, 5);
            updateHUD();
          } else if (this.type === 'speed') {
            player.speed = 3.5;
            setTimeout(() => { if (player.active) player.speed = 2.5; }, 8000);
          } else if (this.type === 'rapid') {
            player.shootDelay = 10;
            setTimeout(() => { if (player.active) player.shootDelay = 20; }, 8000);
          }
        }

        draw() {
          if (!this.active) return;
          const pulse = Math.sin(frameCount * 0.1) * 0.3 + 0.7;
          ctx.fillStyle = this.type === 'life' ? '#e94560' :
            this.type === 'speed' ? '#4ecca3' :
            this.type === 'rapid' ? '#f5c518' : '#aaa';
          ctx.globalAlpha = pulse;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(
            this.type === 'life' ? '❤' :
            this.type === 'speed' ? '⚡' :
            this.type === 'rapid' ? '🔥' : '?',
            this.x, this.y + 5);
          ctx.globalAlpha = 1;
        }
      }

      // --- Particles & Explosions ---
      function spawnExplosion(x, y) {
        shakeTimer = 10;
        shakeIntensity = 4;
        const colors = ['#e94560', '#f5c518', '#ff6b6b', '#fff', '#ffa500'];
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 3;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: 2 + Math.random() * 4,
          });
        }
      }

      function spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 2;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 10 + Math.random() * 10,
            maxLife: 20,
            color,
            size: 1 + Math.random() * 3,
          });
        }
      }

      // --- Level Maps ---
      function generateLevel(lvl) {
        walls = [];
        const map = getLevelMap(lvl);

        // Add border walls
        for (let i = 0; i < COLS; i++) {
          for (let j = 0; j < ROWS; j++) {
            if (map[j] && map[j][i]) {
              const c = map[j][i];
              if (c === 'B') {
                walls.push(createWall(i * TILE + TILE / 2, j * TILE + TILE / 2, true));
              } else if (c === 'W') {
                walls.push(createWall(i * TILE + TILE / 2, j * TILE + TILE / 2, false));
              }
            }
          }
        }
      }

      function createWall(x, y, breakable) {
        return {
          x, y,
          w: TILE,
          h: TILE,
          breakable,
          active: true,
          getBounds() {
            return {
              left: this.x - this.w / 2,
              right: this.x + this.w / 2,
              top: this.y - this.h / 2,
              bottom: this.y + this.h / 2,
            };
          }
        };
      }

      function getLevelMap(lvl) {
        // Predefined maps, cycling with variations
        const maps = [
          // Level 1 - Classic
          [
            'WWWWWWWWWWWWWWWWWWWWWWWWWW',
            'W............W...........W',
            'W.BBB..W....W....W...BBB.W',
            'W.BBB..W....W....W...BBB.W',
            'W......W....W....W.......W',
            'W..BBB.W....W....W.BBB...W',
            'W..BBB.W....W....W.BBB...W',
            'W......W.........W.......W',
            'W......W.........W.......W',
            'W..W...W..............W..W',
            'W..W...W..............W..W',
            'W......W.........W.......W',
            'W......W.........W.......W',
            'W..BBB.W....W....W.BBB...W',
            'W..BBB.W....W....W.BBB...W',
            'W......W....W....W.......W',
            'W.BBB..W....W....W...BBB.W',
            'W.BBB..W....W....W...BBB.W',
            'W............W...........W',
            'WWWWWWWWWWWWWWWWWWWWWWWWWW',
          ],
          // Level 2 - Maze
          [
            'WWWWWWWWWWWWWWWWWWWWWWWWWW',
            'W.....W.....W.....W.....W',
            'W.WWW.W.WWW.W.WWW.W.WWW.W',
            'W.WWW.W.WWW.W.WWW.W.WWW.W',
            'W.....W.....W.....W.....W',
            'W.WWW.W.W.WWWWW.W.W.WWW.W',
            'W.WWW.W.W.WWWWW.W.W.WWW.W',
            'W.....W.....W.....W.....W',
            'W.WWW.W.WWW.W.WWW.W.WWW.W',
            'W.W.W.W.WWW.W.WWW.W.W.W.W',
            'W...W.W...........W.W...W',
            'WWW.W.W.BWWBWWBWWB.W.WWWW',
            'WWW.W.W.B......B.W.W.WWWW',
            'W...W...BBBBBBBB...W...W',
            'W.W.W.W.B......B.W.W.W.W',
            'W.W.W.W.BWWBWWBWWB.W.W.W',
            'W...W...............W...W',
            'W.WWWWW.WWWWWWWWWW.WWWW.W',
            'W...............W.......W',
            'WWWWWWWWWWWWWWWWWWWWWWWWWW',
          ],
          // Level 3 - Fortress
          [
            'WWWWWWWWWWWWWWWWWWWWWWWWWW',
            'W........W.....W........W',
            'W.BB.....W.....W.....BB.W',
            'W.BB..WWWW.....WWWW..BB.W',
            'W......BB.......BB......W',
            'W......BB.......BB......W',
            'WWW...W...........W...WWW',
            'W.....W....BBB....W.....W',
            'W.....W...BBBBB...W.....W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W..W......BBBBB......W..W',
            'W.....W...BBBBB...W.....W',
            'W.....W....BBB....W.....W',
            'WWWWWWWWWWWWWWWWWWWWWWWWWW',
          ],
        ];

        const idx = (lvl - 1) % maps.length;
        const map = maps[idx];
        // Normalize: ensure every row has exactly COLS characters
        return map.map(row => {
          if (row.length < COLS) return row + row[0].repeat(COLS - row.length);
          return row.slice(0, COLS);
        });
      }

      // --- Spawning ---
      function findClearSpawn(row, preferCenter = false) {
        const candidates = [];
        const map = getLevelMap(level);
        for (let col = 1; col < COLS - 1; col++) {
          if (map[row] && map[row][col] === '.') {
            candidates.push({ x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 });
          }
        }
        if (candidates.length === 0) {
          return { x: W / 2, y: row * TILE + TILE / 2 };
        }
        if (preferCenter) {
          return candidates[Math.floor(candidates.length / 2)];
        }
        return candidates[Math.floor(Math.random() * candidates.length)];
      }

      function spawnPlayer() {
        const pt = findClearSpawn(ROWS - 2, true);
        player = new Tank(pt.x, pt.y, 0, '#4ecca3', true);
      }

      function spawnEnemy() {
        if (enemiesSpawned >= enemiesPerLevel) return;
        const enemyTypes = [
          { color: '#e94560', hp: 1 },
          { color: '#ff6b6b', hp: 1 },
          { color: '#f39c12', hp: 2 },
          { color: '#e74c3c', hp: 2 },
        ];
        const type = enemyTypes[Math.min(level - 1, enemyTypes.length - 1)];
        const pt = findClearSpawn(1); // top row area

        // Don't spawn on top of player
        if (player && player.active) {
          const dx = pt.x - player.x;
          const dy = pt.y - player.y;
          if (Math.abs(dx) < TILE * 3 && Math.abs(dy) < TILE * 3) return;
        }

        const enemy = new Tank(pt.x, pt.y, 2, type.color, false);
        enemy.hp = type.hp;
        enemies.push(enemy);
        enemiesSpawned++;
        totalEnemies++;
      }

      // --- HUD ---
      function updateHUD() {
        livesDisplay.textContent = lives;
        levelDisplay.textContent = level;
        scoreDisplay.textContent = score;
      }

      // --- Game Flow ---
      function startGame() {
        gameState = 'playing';
      }

      function resetGame() {
        score = 0;
        lives = 3;
        level = 1;
        enemiesPerLevel = 4;
        updateHUD();
      }

      function initLevel() {
        enemies = [];
        bullets = [];
        particles = [];
        powerUps = [];
        enemiesSpawned = 0;
        totalEnemies = 0;
        spawnTimer = 60;
        generateLevel(level);
        spawnPlayer();
        enemiesPerLevel = 4 + (level - 1) * 2;
        spawnDelay = Math.max(60, 180 - (level - 1) * 10);
        updateHUD();
      }

      function nextLevel() {
        level++;
        initLevel();
        gameState = 'playing';
        updateHUD();
      }

      function checkLevelClear() {
        if (totalEnemies <= 0 && enemiesSpawned >= enemiesPerLevel) {
          gameState = 'levelClear';
          score += 200;
          updateHUD();
        }
      }

      // --- Draw ---
      function drawWalls() {
        for (let w of walls) {
          if (!w.active) continue;
          const x = w.x - TILE / 2;
          const y = w.y - TILE / 2;
          if (w.breakable) {
            ctx.fillStyle = '#c49a2c';
            ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
            ctx.fillStyle = '#8b6914';
            ctx.fillRect(x + 3, y + 3, TILE / 2 - 3, TILE / 2 - 3);
            ctx.fillRect(x + TILE / 2 + 1, y + TILE / 2 + 1, TILE / 2 - 4, TILE / 2 - 4);
            ctx.fillRect(x + TILE / 2 + 1, y + 3, TILE / 2 - 4, TILE / 2 - 3);
            ctx.fillRect(x + 3, y + TILE / 2 + 1, TILE / 2 - 3, TILE / 2 - 4);
          } else {
            ctx.fillStyle = '#555';
            ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = '#666';
            ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
            ctx.fillStyle = '#4a4a4a';
            ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
            // Cross pattern
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + TILE / 2, y + 4);
            ctx.lineTo(x + TILE / 2, y + TILE - 4);
            ctx.moveTo(x + 4, y + TILE / 2);
            ctx.lineTo(x + TILE - 4, y + TILE / 2);
            ctx.stroke();
          }
        }
      }

      function drawBackground() {
        // Grid
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 0.5;
        for (let x = 0; x < W; x += TILE) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = 0; y < H; y += TILE) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
      }

      function drawUI() {
        if (gameState === 'menu') {
          ctx.fillStyle = 'rgba(0,0,0,0.75)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#e94560';
          ctx.font = 'bold 52px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('坦 克 大 战', W / 2, H / 2 - 40);
          ctx.fillStyle = '#4ecca3';
          ctx.font = '18px "Courier New", monospace';
          ctx.fillText('TANK BATTLE', W / 2, H / 2 + 10);
          ctx.fillStyle = '#e0e0e0';
          ctx.font = '16px "Courier New", monospace';
          const blink = Math.sin(frameCount * 0.06) > 0;
          if (blink) ctx.fillText('Press any key to start', W / 2, H / 2 + 60);
        } else if (gameState === 'paused') {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#f5c518';
          ctx.font = 'bold 36px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('PAUSED', W / 2, H / 2);
          ctx.fillStyle = '#e0e0e0';
          ctx.font = '16px "Courier New", monospace';
          ctx.fillText('Press P to resume', W / 2, H / 2 + 40);
        } else if (gameState === 'levelClear') {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#4ecca3';
          ctx.font = 'bold 36px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`Stage ${level} Clear!`, W / 2, H / 2 - 15);
          ctx.fillStyle = '#f5c518';
          ctx.font = '18px "Courier New", monospace';
          ctx.fillText(`+200 Bonus`, W / 2, H / 2 + 25);
          ctx.fillStyle = '#e0e0e0';
          ctx.font = '16px "Courier New", monospace';
          const blink = Math.sin(frameCount * 0.06) > 0;
          if (blink) ctx.fillText('Press Space for next stage', W / 2, H / 2 + 60);
        } else if (gameState === 'gameOver') {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#e94560';
          ctx.font = 'bold 42px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
          ctx.fillStyle = '#f5c518';
          ctx.font = '18px "Courier New", monospace';
          ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 20);
          ctx.fillStyle = '#e0e0e0';
          ctx.font = '16px "Courier New", monospace';
          const blink = Math.sin(frameCount * 0.06) > 0;
          if (blink) ctx.fillText('Press Space to restart', W / 2, H / 2 + 60);
        }
      }

      // --- Main Game Loop ---
      function update() {
        if (gameState !== 'playing') return;

        // Player
        if (player && player.active) player.update();

        // Enemies
        for (let e of enemies) e.update();

        // Bullets
        for (let b of bullets) b.update();
        bullets = bullets.filter(b => b.active);

        // Particles
        for (let p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
        }
        particles = particles.filter(p => p.life > 0);

        // Power-ups
        for (let pu of powerUps) pu.update();
        powerUps = powerUps.filter(p => p.active);

        // Shake
        if (shakeTimer > 0) shakeTimer--;

        // Enemy spawning
        spawnTimer--;
        if (spawnTimer <= 0 && enemiesSpawned < enemiesPerLevel && enemies.filter(e => e.active).length < 3) {
          spawnEnemy();
          spawnTimer = spawnDelay;
        }

        // Clean up dead enemies
        enemies = enemies.filter(e => e.active || e.flash > 0);

        // Random power-up
        if (frameCount % 900 === 450 && Math.random() < 0.3) {
          const types = ['speed', 'rapid', 'life'];
          const type = types[Math.floor(Math.random() * types.length)];
          const px = TILE * 3 + Math.random() * (W - TILE * 6);
          const py = TILE * 3 + Math.random() * (H - TILE * 6);
          // Don't spawn on walls
          let blocked = false;
          for (let w of walls) {
            if (w.active && px > w.getBounds().left && px < w.getBounds().right &&
              py > w.getBounds().top && py < w.getBounds().bottom) {
              blocked = true;
              break;
            }
          }
          if (!blocked) powerUps.push(new PowerUp(px, py, type));
        }

        checkLevelClear();

        // Respawn player if dead and lives remain
        if (!player.active && lives > 0 && gameState === 'playing') {
          // handled in takeDamage
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Screen shake
        ctx.save();
        if (shakeTimer > 0) {
          const sx = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 10);
          const sy = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 10);
          ctx.translate(sx, sy);
        }

        drawBackground();
        drawWalls();

        // Power-ups
        for (let pu of powerUps) pu.draw();

        // Bullets
        for (let b of bullets) b.draw();

        // Particles
        for (let p of particles) {
          const alpha = p.life / p.maxLife;
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Enemies
        for (let e of enemies) e.draw();

        // Player
        if (player && player.active) player.draw();

        ctx.restore();

        drawUI();
      }

      function loop() {
        frameCount++;
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // --- Init ---
      initLevel();
      gameState = 'menu';
      updateHUD();
      loop();
    })();
  </script>
</body>
